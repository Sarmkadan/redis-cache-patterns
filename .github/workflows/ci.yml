name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          # Project targets net10.0 and global.json pins SDK 10.0.100
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore redis-cache-patterns.sln

      - name: Build
        run: dotnet build redis-cache-patterns.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test redis-cache-patterns.sln --no-build --configuration Release --verbosity normal
